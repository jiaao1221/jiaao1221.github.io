<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 马的身体 -->
  <path d="M40,80 Q30,60 40,40 Q50,20 70,30 Q90,40 100,60 Q110,80 100,100 Q90,120 70,110 Q50,100 40,80 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
  <!-- 马的头部 -->
  <path d="M100,60 Q110,50 120,55 Q130,60 125,70 Q120,80 110,75 Q100,70 100,60 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
  <!-- 马的腿部 -->
  <path d="M50,100 L45,130 L55,130 L60,100 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
  <path d="M80,110 L75,140 L85,140 L90,110 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
  <!-- 马的尾巴 -->
  <path d="M40,80 Q20,90 25,110 Q30,130 40,120 Q50,110 40,80 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
  <!-- 马的鬃毛 -->
  <path d="M100,60 Q95,40 90,50 Q85,60 90,70 Q95,80 100,70 Z" fill="url(#goldGradient)" stroke="#DAA520" stroke-width="2"/>
</svg>